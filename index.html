<body><div class="app" id="app"><div id="main"></div><div class="hud"><button class="menu-toggle" id="menuToggle" aria-controls="sectionMenu" aria-expanded="false">Menu ▾</button><nav class="menu hidden" id="sectionMenu" aria-label="Module 12 navigation"></nav></div></div>
<div id="modalBackdrop" class="modal-backdrop hidden" role="presentation"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><button class="close-btn" id="closeModal" aria-label="Close dialog">×</button><div id="modalContent"></div></section></div>
<script>
(()=>{'use strict';
const root='https://cestuve.github.io/';
const IMG={exterior:root+'module1/BG-01.png',office:root+'module2/Maria_Office.png',training:root+'module9/Community_Meeting_Room.png',group:root+'module9/Staff_Training_Room.png',maria:root+'Module12/Maria_Fullbody.png',mariaHead:root+'Module12/Maria_Headshot.png',daniel:root+'Module12/Daniel_Fullbody.png',danielHead:root+'Module12/Daniel_Headshot.png',jamal:root+'Module12/Jamal_Headshot.png',tanya:root+'Module12/Tanya_Headshot.png',krishna:root+'Module12/Krishna_Headshot.png'};
const main=document.getElementById('main'),mb=document.getElementById('modalBackdrop'),mc=document.getElementById('modalContent'),menu=document.getElementById('sectionMenu'),toggle=document.getElementById('menuToggle');
const storeKey='harborPointModule12PreviewV1';let state={section:0,completed:[false,false,false,false,false,false,false,false],checked:false,reflections:["","","",""]};
try{let saved=JSON.parse(localStorage.getItem(storeKey)||'null');if(saved&&Array.isArray(saved.completed)){state={...state,...saved,section:Math.max(0,Math.min(7,Number(saved.section)||0))}}}catch(e){}
function save(){try{localStorage.setItem(storeKey,JSON.stringify(state))}catch(e){}}
const titles=['Welcome Back to Harbor Point','Why Group Therapy Matters','Types of Therapeutic Groups','Matching Clients to Groups','Creating a Safe Group Environment',"The Counselor's Role",'Challenges in Group Therapy','Group Therapy in Practice'];
const subtitles=['Meet Maria and Daniel', 'Connection, hope, and shared learning', 'Five therapeutic group models', 'Readiness, goals, and client needs', 'Agreements, privacy, and trust', 'Facilitation and balanced participation', 'Navigating difficult group moments', 'Apply skills and reflect on practice'];
function renderMenu(){const done=state.completed.filter(Boolean).length;menu.innerHTML=`<div class="menu-progress" role="status">${done} of 8 sections complete</div>`+titles.map((t,i)=>`<button type="button" class="menu-item ${i===state.section?'current':''} ${state.completed[i]?'completed':''}" data-jump="${i}" ${i===state.section?'aria-current="page"':''}><span class="menu-heading"><span class="menu-section-number">${i+1}.</span> ${t}</span><span class="menu-subheading">${subtitles[i]}</span>${state.completed[i]?'<span class="menu-check" aria-hidden="true">✓</span>':''}</button>`).join('')}
function mark(i){state.completed[i]=true;save();renderMenu()}
function visit(i){state.section=i;save();renderMenu()}
function closeModal(){mb.classList.add('hidden');mc.innerHTML=''}
function openModal(markup){mc.innerHTML=markup;mb.classList.remove('hidden');mc.querySelector('h2')?.setAttribute('id','dialogTitle');mc.querySelector('h2')?.focus?.();}
function person(title,description,image,bg,next){main.innerHTML=`<section class="scene"><div class="environment" style="background-image:url('${bg}')"><div class="scene-guide">${description}</div><img class="center-char" alt="" src="${image}"><button class="character-hit" data-act="${next}" aria-label="Talk with ${title}"></button></div></section>`}
function heading(name,img,subtitle=''){const speakingTitles=new Set();const showAvatar=(img!==IMG.danielHead&&img!==IMG.mariaHead)||speakingTitles.has(name);return `<div class="headrow">${showAvatar?`<img src="${img}" alt="">`:''}<div><h2 tabindex="-1">${name}</h2>${subtitle?`<p style="margin:4px 0 0">${subtitle}</p>`:''}</div></div>`}

const casePhoto={Jamal:'https://cestuve.github.io/Module12/Jamal_Headshot.png',Tanya:'https://cestuve.github.io/Module12/Tanya_Headshot.png',Krishna:'https://cestuve.github.io/Module12/Krishna_Headshot.png',Alyssa:'https://cestuve.github.io/Module12/Alyssa_Headshot.png',Nadia:'https://cestuve.github.io/Module12/Nadia_Headshot.png',Dante:'http://cestuve.github.io/Module12/Dante_Headshot.png',Danar:'https://cestuve.github.io/Module12/Danar_Headshot.png'};
function caseTitle(t){return `<div class="case-heading"><h2 tabindex="-1">${t}</h2></div>`}
function portraitFor(name){const found=Object.keys(casePhoto).find(n=>String(name).includes(n));return found?`<img src="${casePhoto[found]}" alt="${found}" class="${found==='Alyssa'||found==='Danar'?'lower-face':''}">`:''}
function caseDescription(name,stem,question,swapJamalTanya=false){let mentioned=Object.keys(casePhoto).filter(n=>new RegExp('\\b'+n+'\\b','i').test(String(name)+' '+String(stem)));if(swapJamalTanya && mentioned.includes('Jamal') && mentioned.includes('Tanya')){mentioned=mentioned.filter(n=>n!=='Jamal'&&n!=='Tanya');mentioned.unshift('Tanya','Jamal')}const portraits=mentioned.map(n=>portraitFor(n)).join('');return `<div class="case-copy">${portraits?`<div class="case-portraits">${portraits}</div>`:''}<p>${stem}${question?`<span class="case-question"><strong>${question}</strong></span>`:''}</p></div>`}
function fullbodyLineup(){return `<div class="client-lineup" aria-label="Group members"><div><img src="${IMG.jamal}" alt="Jamal"><strong>Jamal</strong></div><div><img src="${IMG.tanya}" alt="Tanya"><strong>Tanya</strong></div><div><img src="${IMG.krishna}" alt="Krishna"><strong>Krishna</strong></div></div>`}

function actionButtons(buttons){return `<div class="modal-actions">${buttons.map(b=>`<button class="${b.secondary?'secondary-btn':'primary-btn'}" data-act="${b.a}">${b.t}</button>`).join('')}</div>`}
function intro(){closeModal();main.innerHTML=`<div class="intro-scene"><div class="intro-panel"><span class="mini-label">Harbor Point · Module 12</span><h1>Group Therapy,<br>Part 1</h1><div class="intro-rule"></div><p class="intro-copy">This week, you'll explore how therapeutic groups help people with substance use disorders connect with others, practice new skills, and build support for recovery. After your initial meeting with Maria, Daniel will guide you through what makes group work different from individual counseling.</p><div class="button-row"><button class="primary-btn" data-act="exterior">Return to Harbor Point →</button></div></div></div>`}
function exterior(){closeModal();visit(0);main.innerHTML=`<section class="scene"><div class="environment" style="background-image:url('${IMG.exterior}')"><div class="scene-title-card" style="top:110px;left:7%"><span class="mini-label">Module 12 · Back at Harbor Point</span><h1>Harbor Point Recovery Services</h1><p>You're back at Harbor Point to learn how people support one another in group treatment. Maria is waiting inside to introduce this week's work.</p></div><button class="hotspot" data-act="maria-scene" type="button" aria-label="Click the entrance doors to enter Harbor Point and meet Maria" title="Enter Harbor Point" style="left:52%;top:34%;width:18%;height:36%"></button></div></section>`}
function mariaScene(){visit(0);closeModal();person('Maria','Maria has an introduction to the group work you will explore this week.',IMG.maria,IMG.office,'maria-talk')}
function mariaTalk(){openModal(heading('Welcome Back to Harbor Point',IMG.mariaHead)+`<p>In previous weeks, you practiced working with individual clients. This week, we are stepping into a group setting, where clients can learn not only from a counselor but also from one another.</p><p>Group therapy can reduce isolation, encourage connection, and create opportunities to practice communication and coping skills. It also brings special responsibilities around safety, confidentiality, and group dynamics.</p><div class="guidance">You will begin by exploring why group therapy is valuable. In later sections, we will look at different group models and how counselors help groups function well.</div>`+actionButtons([{t:'Meet with Daniel →',a:'daniel-scene'}]))}
function danielScene(){closeModal();person('Daniel','Daniel wants to introduce what makes group therapy different from individual counseling.',IMG.daniel,IMG.training,'daniel-talk')}
function danielTalk(){openModal(heading('Learning Together',IMG.danielHead)+`<p>In a one-to-one session, a counselor works directly with one client. In a therapy group, the interactions between members can become an important part of treatment.</p><p>Clients may recognize similar experiences, see recovery modeled by others, receive respectful feedback, and practice new ways of relating.</p><p>Unlike peer-led mutual-help meetings, the therapeutic groups we are studying are intentionally designed to support treatment and are guided by appropriately trained professionals.</p><div class="guidance">Your task is not to convince every client to speak. It is to recognize what the group can offer and what supports safe participation.</div>`+actionButtons([{t:'Explore Group Therapy →',a:'benefits'}]))}
function benefitsScene(){visit(1);benefits()}
function benefits(){visit(1);openModal(heading('Why Group Therapy Matters',IMG.danielHead)+`<p>In group treatment for substance use disorders, participants can discover that they are not alone while benefiting from supportive interactions with people who understand some of their challenges.</p><div class="info-cards"><article><span class="benefit-icon" aria-hidden="true">🤝</span><h3>Belonging and connection</h3><p>Shared experiences can reduce shame and isolation and help members feel understood.</p></article><article><span class="benefit-icon" aria-hidden="true">🌱</span><h3>Hope and encouragement</h3><p>Seeing other people make progress offers examples of recovery and reasons for hope.</p></article><article><span class="benefit-icon" aria-hidden="true">💬</span><h3>Feedback and accountability</h3><p>Respectful input from peers may help clients recognize patterns and sustain engagement.</p></article><article><span class="benefit-icon" aria-hidden="true">🧰</span><h3>Practice and new skills</h3><p>Group members can try out coping, communication, and relationship skills in a supported setting.</p></article></div><p>These benefits are possibilities, not guarantees. A group must be well matched to members' needs and facilitated with care.</p>`+actionButtons([{t:'See Group Therapy in Action →',a:'scenario'}]))}
function scenario(){openModal(heading('A New Member Joins the Group',IMG.danielHead)+`<p>At a professionally facilitated substance use disorder treatment group, a new member says, “I don't think anyone here could understand what I've been through. I feel embarrassed being here.”</p><p><strong>What is the most helpful response from the group facilitator?</strong></p><div class="option-grid" id="opts"><button data-choice="0">A. “There is no reason to be embarrassed. Everyone here has problems.”</button><button data-choice="1">B. “Other members have experienced worse things, so you will fit in.”</button><button data-choice="2">C. “You must tell your story first so the group can understand you.”</button><button data-choice="3">D. “You don't have to share more than you're ready to. Would it help to hear how others felt when they first came?”</button></div><div id="scenarioFeedback" aria-live="polite"></div>`)}
function answer(choice){const correct=Number(choice)===3;const buttons=mc.querySelectorAll('[data-choice]');buttons.forEach(b=>{b.classList.remove('correct','incorrect');b.disabled=correct;if(correct&&Number(b.dataset.choice)===3)b.classList.add('correct')});const selected=mc.querySelector(`[data-choice="${Number(choice)}"]`);if(!correct&&selected)selected.classList.add('incorrect');document.getElementById('scenarioFeedback').innerHTML=`<div class="feedback-card ${correct?'correct':'incorrect'}" role="status"><strong>${correct?'Correct':'Try again.'}</strong><p>${correct?'This response respects choice and safety while allowing peer connection to emerge naturally.':'Think about how you can acknowledge the new member’s feelings while respecting their choice about what to share. Select another answer.'}</p></div>`+(correct?actionButtons([{t:'Continue →',a:'group-roles'}]):'');if(correct){state.checked=true;save()}}

function groupRoles(){openModal(heading('Why the Group Itself Matters',IMG.danielHead)+`<p>Group counseling is more than conducting individual counseling with several people in the room. Members can help one another by sharing perspectives and practicing new skills. The counselor supports the relationships and interactions that make this possible.</p><div class="info-cards"><article><h3>Peer support</h3><p>A member hears another describe a challenge and realizes their experience is not unique.</p></article><article><h3>Practice in real time</h3><p>Members listen to one another, respectfully disagree, and rehearse healthier communication.</p></article><article><h3>Professional facilitation</h3><p>A trained leader protects safety, clarifies expectations, and guides the group's therapeutic purpose.</p></article><article><h3>Individual differences</h3><p>Not every group is appropriate for every client. Needs and readiness matter.</p></article></div><p><strong>Remember:</strong> Peer-led mutual-help groups may be valuable recovery supports, but they are not the same as professionally facilitated treatment groups.</p>`+actionButtons([{t:'Explore the Optional Resource →',a:'resource'}]))}
function resource(){openModal(heading('Optional Reference: SAMHSA TIP 41',IMG.danielHead)+`<p>Everything required for this lesson has been taught within the module. You do not need to read the linked PDF to complete the activities.</p><p>However, for additional background, you may consult <em>Substance Abuse Treatment: Group Therapy</em>, <em>TIP 41</em>. Chapters 1–3 discuss the benefits of group treatment, common group models, and client placement considerations.</p><p><a class="source-link" href="https://library.samhsa.gov/sites/default/files/sma15-3991.pdf" target="_blank" rel="noopener noreferrer">Open SAMHSA TIP 41</a></p><p>Please save this file as a resource to reference throughout your future work as a CDCA.</p>`+actionButtons([{t:'Explore Types of Groups →',a:'models-direct'}]))}
function endPreview(){mark(0);mark(1);closeModal();main.innerHTML=`<div class="intro-scene"><div class="intro-panel"><span class="mini-label">Module 12 · Draft Preview</span><h2>You've completed Sections 1 and 2</h2><p class="intro-copy">You've explored what therapeutic groups can offer, why interactions between members matter, and how a trained facilitator can encourage safety and participation.</p><p class="intro-copy">Coming next: <strong>Types of Therapeutic Groups</strong>—including psychoeducational, skills development, cognitive-behavioral, support, and interpersonal process groups.</p><div class="button-row"><button class="primary-btn" data-act="benefits-scene">Review Section 2 →</button><button class="secondary-btn" data-act="maria-scene">Return to Beginning</button></div></div></div>`}

// Section 3: Therapeutic group models. Five models described in SAMHSA TIP 41, Chapter 2.
const groupModels=[
 {icon:'📘',title:'Psychoeducational groups',purpose:'Help participants understand substance use, recovery, and related health information.',example:'A facilitator explains the connection between cravings, triggers, and recovery supports.',technique:'Brief teaching, visuals, guided discussion, and questions.'},
 {icon:'🧰',title:'Skills development groups',purpose:'Teach and rehearse practical coping and interpersonal skills.',example:'Members practice declining an offer to drink and give one another constructive feedback.',technique:'Demonstration, role-play, coaching, and repetition.'},
 {icon:'🔄',title:'Cognitive-behavioral groups',purpose:'Help members identify and change patterns of thinking and behavior connected to substance use.',example:'Members notice the thought “One slip means I have failed” and examine a more helpful response.',technique:'Thought–feeling–behavior mapping, worksheets, and behavioral practice.'},
 {icon:'🤝',title:'Support groups',purpose:'Build encouragement, belonging, mutual understanding, and practical support in recovery.',example:'Members share what helped them through a difficult week and respond respectfully to one another.',technique:'Supported sharing, peer feedback, affirmations, and connection.'},
 {icon:'💬',title:'Interpersonal process groups',purpose:'Explore patterns in relationships and feelings as they arise in interactions among members.',example:'A trained group therapist helps members notice how interruptions in the group affect trust.',technique:'Exploration of here-and-now interactions under appropriately trained clinical leadership.'}
];
function modelCards(){return `<div class="info-cards model-cards">${groupModels.map((m,i)=>`<article><span class="benefit-icon" aria-hidden="true">${m.icon}</span><h3>${i+1}. ${m.title}</h3><p><strong>Purpose:</strong> ${m.purpose}</p><p><strong>Example:</strong> ${m.example}</p><p><strong>Common methods:</strong> ${m.technique}</p></article>`).join('')}</div>`}
function modelsScene(){visit(2);closeModal();person('Daniel','Daniel will help you compare different kinds of therapy groups and their purposes.',IMG.daniel,IMG.training,'models-intro')}
function modelsIntro(){openModal(heading('Different Groups, Different Goals',IMG.danielHead)+`<p>Not all therapy groups work the same way. A group may teach information, develop a skill, explore thinking patterns, strengthen peer support, or examine relationship patterns.</p><p>According to SAMHSA TIP 41, five common therapeutic group models are <strong>psychoeducational, skills development, cognitive-behavioral, support, and interpersonal process</strong> groups.</p><div class="guidance">The aim is not to memorize labels. Think about what each group helps people accomplish and how a group might fit a client's particular needs.</div>`+actionButtons([{t:'Explore the Five Group Models →',a:'models-guide'}]))}
function modelsGuide(){openModal(heading('Five Therapeutic Group Models',IMG.danielHead)+`<p>Review the purpose, example, and common methods for each approach below. These descriptions will remain available as a reference in the next activity, but it’s important to review them now and get a base understanding.</p>${modelCards()}<div class="guidance"><strong>Another common focus:</strong> Relapse prevention groups help participants identify triggers, practice coping responses, and plan for high-risk situations. They can use elements of the models above.</div><p class="small muted">The same client may benefit from more than one model over time. Group placement is individualized and guided by appropriately qualified clinicians.</p>`+actionButtons([{t:'Apply What You Learned →',a:'model-cases'}]))}
const groupCases=[
 {name:'Krishna',stem:'Krishna has recently resumed substance use. He wants help recognizing early warning signs and responding when he feels at risk of using again. The team is considering a group with trigger mapping and coping plans.',choices:['A relapse prevention group that practices recognizing triggers and developing coping plans','A group primarily focused on sharing recovery stories without a structured coping activity','An interpersonal process group exploring long-standing relationship patterns','A group that provides only introductory information about addiction'],answer:0,why:'Krishna is asking for practical ways to recognize risks and respond to them. Structured relapse prevention activities address that goal. A clinician would also assess current safety, needs, and readiness.'},
 {name:'Jamal',stem:'Jamal is new to treatment. He wants to understand how substance use can affect sleep, mood, and cravings, and would like a clear introduction before sharing much about himself.',choices:['A psychoeducational group with information and opportunities to ask questions','An interpersonal process group requiring immediate discussion of private relationships','A skills group that assumes he already understands the recovery concepts','A support group requiring everyone to describe their personal history at the first meeting'],answer:0,why:'Psychoeducation can provide accessible information without demanding immediate disclosure. Jamal should still be invited to participate at a pace that feels safe.'},
 {name:'Tanya',stem:'Tanya is enthusiastic about recovery but notices that she interrupts others when she gets excited. She wants to practice pausing, listening, and taking turns in conversations.',choices:['A lecture-only group about substance use statistics','A group without any discussion or feedback','A skills development group that rehearses listening and turn-taking','A group that asks other members to ignore all interruptions'],answer:2,why:'Skills development gives Tanya a structured chance to practice listening and communication. Group facilitators can coach everyone respectfully without shaming one participant.'},
 {name:'Alyssa',stem:'Alyssa says, “If I had one difficult weekend, that proves I can never make progress.” She wants to learn how to respond differently to discouraging thoughts that affect her decisions.',choices:['A support group that prohibits discussion of thinking patterns','A cognitive-behavioral group that explores links among thoughts, feelings, and actions','A group focused only on explaining the history of addiction treatment','An interpersonal process group regardless of Alyssa’s goals or readiness'],answer:1,why:'A cognitive-behavioral approach helps examine how self-defeating thoughts influence emotions and behavior, and supports practicing alternative responses.'},
 {name:'Danar',stem:'Danar feels isolated during recovery. His main hope for group treatment is to meet others who understand his experience, feel less alone, and find encouragement.',choices:['A support group organized around respectful sharing and mutual encouragement','A group that requires every member to master a complex worksheet before speaking','An exclusively lecture-based format with no peer interaction','A group that challenges new members to disclose sensitive details immediately'],answer:0,why:'A support-oriented group is especially well aligned with Devon’s stated need for connection, belonging, and mutual encouragement.'}
];
let modelCaseIndex=0;
function modelCases(){modelCaseIndex=0;showModelCase()}
function showModelCase(){let c=groupCases[modelCaseIndex];const clientHeads=['https://cestuve.github.io/Module12/Krishna_Headshot.png','https://cestuve.github.io/Module12/Jamal_Headshot.png','https://cestuve.github.io/Module12/Tanya_Headshot.png','https://cestuve.github.io/Module12/Alyssa_Headshot.png','https://cestuve.github.io/Module12/Danar_Headshot.png'];openModal(caseTitle(`Matching Group Goals: ${modelCaseIndex+1} of ${groupCases.length}`)+caseDescription(c.name,c.stem,'Which group approach best matches the goal described?')+`<div class="option-grid">${c.choices.map((v,i)=>`<button data-model-choice="${i}" type="button">${String.fromCharCode(65+i)}. ${v}</button>`).join('')}</div><div id="modelFeedback" aria-live="polite"></div><details class="model-reference"><summary>Review the five group models (reference)</summary>${modelCards()}</details>`)}
function answerModel(i){const c=groupCases[modelCaseIndex],correct=i===c.answer;const buttons=mc.querySelectorAll('[data-model-choice]');buttons.forEach(b=>{b.disabled=correct;b.classList.remove('correct','incorrect');if(correct&&Number(b.dataset.modelChoice)===c.answer)b.classList.add('correct')});if(!correct)mc.querySelector(`[data-model-choice="${i}"]`)?.classList.add('incorrect');document.getElementById('modelFeedback').innerHTML=`<div class="feedback-card ${correct?'correct':'incorrect'}" role="status"><strong>${correct?'Correct':'Try again.'}</strong><p>${correct?c.why:'Think about the client’s needs, autonomy, safety, and the purpose of the group. Select another response.'}</p></div>`+(correct?actionButtons([{t:modelCaseIndex===groupCases.length-1?'Summarize Group Models →':'Next Client →',a:'model-next'}]):'')}
function nextModel(){modelCaseIndex++;if(modelCaseIndex>=groupCases.length){modelWrap()}else showModelCase()}
function modelWrap(){openModal(heading('Matching the Group to the Person',IMG.danielHead)+`<p>Different therapeutic groups provide different kinds of learning and support. The best choice is not simply the most intensive group or the one that is easiest to schedule.</p><div class="info-cards"><article><h3>🎯 Start with the goal</h3><p>Ask what the person hopes the group will help them learn or accomplish.</p></article><article><h3>🧭 Consider readiness</h3><p>Look at willingness, stability, interpersonal needs, and potential barriers to participation.</p></article><article><h3>🤲 Protect safety</h3><p>Do not pressure a person to disclose private experiences as a condition of belonging.</p></article><article><h3>👥 Work as a team</h3><p>Appropriate group selection and facilitation involve qualified providers and ongoing assessment.</p></article></div>`+actionButtons([{t:'Continue →',a:'end-third'}]))}
function endThird(){mark(2);placementScene()}


// Section 4: Individualized client placement, based on TIP 41 Chapter 3.
function placementScene(){visit(3);closeModal();person('Daniel','Before matching someone to a group, Daniel wants you to think about the whole person.',IMG.daniel,IMG.training,'placement-intro')}
function placementIntro(){openModal(heading('Matching Clients to Groups',IMG.danielHead)+`<p>There is no single “best group” for every person. A group should fit the individual's goals, current needs, ability to participate safely, and preferences. A client's circumstances may also change over time.</p><p>In SAMHSA TIP 41, Chapter 3 emphasizes assessment and thoughtful placement, not simply assigning clients to the next available group.</p><div class="guidance"><strong>Your role:</strong> As a CDCA or beginning practitioner, recognize concerns, ask respectful questions, document observations, and consult a qualified supervisor or clinician. Do not independently make placement decisions beyond your training and scope.</div>`+actionButtons([{t:'Explore Placement Considerations →',a:'placement-factors'}]))}
function placementFactors(){openModal(heading('What Should We Consider?',IMG.danielHead)+`<p>Review these factors before practicing. Remember that no factor should be used as a shortcut to label a client as “good” or “bad” for group treatment.</p><div class="info-cards">
<article><span class="benefit-icon" aria-hidden="true">🎯</span><h3>Goals and group model</h3><p>What does the client hope to gain: information, coping skills, peer support, or deeper work on relationships?</p></article>
<article><span class="benefit-icon" aria-hidden="true">🗣️</span><h3>Readiness and preferences</h3><p>What does the client understand about group expectations? How comfortable and willing do they feel about attending?</p></article>
<article><span class="benefit-icon" aria-hidden="true">🧭</span><h3>Recovery stage and functioning</h3><p>Consider current support needs, emotional stability, ability to participate, and where the client is in recovery.</p></article>
<article><span class="benefit-icon" aria-hidden="true">🛡️</span><h3>Safety and confidentiality</h3><p>Assess immediate risks, ability to respect group agreements, and whether extra individual support or evaluation is needed.</p></article>
<article><span class="benefit-icon" aria-hidden="true">🌍</span><h3>Culture and belonging</h3><p>Ask about language, identity, past experiences, group dynamics, and what would support a respectful sense of belonging. Avoid assumptions.</p></article>
<article><span class="benefit-icon" aria-hidden="true">🚌</span><h3>Accessibility and practical barriers</h3><p>Explore transportation, scheduling, childcare, disability-related accommodations, and access to a suitable group.</p></article>
</div><div class="guidance"><strong>Remember:</strong> Placement is an ongoing clinical judgment. A client's initial hesitation or difference from other members does not automatically mean group therapy is inappropriate.</div>`+actionButtons([{t:'Practice with Client Referrals →',a:'placement-quiz'}]))}
const placementCases=[
 {name:'Jamal',stem:'Jamal is new to treatment. He would like to meet people in recovery but is nervous about speaking in front of strangers and fears being judged. He has not been told what participation will look like.',question:'What is the most helpful next step before considering placement?',choices:['Require him to share his substance use history in the first session','Explain the group purpose and agreements, ask about his concerns, and explore whether gradual participation would help','Decide that he cannot benefit from any group because he is quiet','Tell the other members why he is nervous before he arrives'],answer:1,why:'Preparation and respectful discussion of expectations can reduce anxiety and help determine a supportive group fit. Discomfort about disclosure alone does not rule out group participation.'},
 {name:'Krishna',stem:'Krishna recently resumed substance use and feels uncertain about discussing it in a group. He also reports feeling unwell today and says he may need medical attention.',question:'What should you prioritize?',choices:['Ask Krishna to disclose the return to use in the next group as proof of honesty','Assign him to an intensive process group immediately','Assess immediate safety within your role, involve a qualified clinician, and arrange appropriate medical evaluation before group placement decisions','Reassure him that physical symptoms have no connection to group readiness'],answer:2,why:'Possible acute medical or safety needs come before routine group placement. The appropriate response is to seek timely clinical evaluation and supervisor guidance rather than pressure a group disclosure.'},
 {name:'Tanya',stem:'Tanya values peer connection. In her first group she frequently interrupts others. She says she wants to improve her listening and is open to feedback.',question:'Which response best supports appropriate placement and participation?',choices:['Consult the facilitator about expectations, coaching, and a skills-focused approach that supports balanced participation','Assume she cannot participate in any group because she speaks often','Let her continue interrupting because she is enthusiastic','Exclude her from discussions whenever other members are present'],answer:0,why:'A collaborative plan with the qualified facilitator may support Tanya’s goals and protect other members’ opportunities to participate. Interruptions call for appropriate support and boundaries, not automatic exclusion.'},
 {name:'Nadia',stem:'Nadia understands the group topic and wants to attend, but the session is conducted only in a language she is not comfortable using. She asks whether there are other options.',question:'What should happen next?',choices:['Tell her that all members must communicate in the same language without assistance','Assume she would prefer a group made up only of people from her cultural background','Enroll her anyway and let other members translate private disclosures informally','Explore her language preferences and accessible alternatives with the treatment team before choosing a group'],answer:3,why:'Culturally responsive placement starts by asking about the individual’s preferences and communication needs. Accessible options should be explored without stereotypes or compromising privacy.'},
 {name:'Dante',stem:'Dante wants to develop coping skills and could benefit from peer practice. His childcare schedule makes him unable to attend the only group offered at 5 p.m.',question:'What is the most appropriate response?',choices:['Document that he lacks motivation for treatment','Work with the treatment team to explore other times, formats, or support services that may allow participation','Require him to attend without discussing childcare arrangements','Place him in a group with a different therapeutic purpose simply because it meets earlier'],answer:1,why:'Practical barriers affect access, not necessarily motivation. Group selection should address both therapeutic fit and the feasibility of regular attendance.'}
];
let placementCaseIndex=0;
function placementQuiz(){placementCaseIndex=0;showPlacementCase()}
function showPlacementCase(){const c=placementCases[placementCaseIndex];openModal(caseTitle(`Client Placement: ${placementCaseIndex+1} of ${placementCases.length}`)+caseDescription(c.name,c.stem,c.question)+`<div class="option-grid">${c.choices.map((x,i)=>`<button type="button" data-placement-choice="${i}">${String.fromCharCode(65+i)}. ${x}</button>`).join('')}</div><div id="placementFeedback" aria-live="polite"></div>`)}
function answerPlacement(i){const c=placementCases[placementCaseIndex],correct=i===c.answer;const buttons=mc.querySelectorAll('[data-placement-choice]');buttons.forEach(b=>{b.disabled=correct;b.classList.remove('correct','incorrect');if(correct&&Number(b.dataset.placementChoice)===c.answer)b.classList.add('correct')});if(!correct)mc.querySelector(`[data-placement-choice="${i}"]`)?.classList.add('incorrect');document.getElementById('placementFeedback').innerHTML=`<div class="feedback-card ${correct?'correct':'incorrect'}" role="status"><strong>${correct?'Correct':'Try again.'}</strong><p>${correct?c.why:'Think about the client’s needs, autonomy, safety, and the purpose of the group. Select another response.'}</p></div>`+(correct?actionButtons([{t:placementCaseIndex===placementCases.length-1?'Review Placement Principles →':'Next Referral →',a:'placement-next'}]):'')}
function placementNext(){placementCaseIndex++;if(placementCaseIndex<placementCases.length)showPlacementCase();else placementWrap()}
function placementWrap(){openModal(heading('Placement Requires Thoughtful Assessment',IMG.danielHead)+`<p>Group therapy can offer connection, feedback, and skill practice, but client needs and group circumstances must be considered together.</p><div class="info-cards"><article><h3>Start with curiosity</h3><p>Learn about the person's goals, experiences, and concerns before making assumptions.</p></article><article><h3>Prioritize safety</h3><p>When medical or mental health needs require prompt attention, consult qualified clinicians before routine placement.</p></article><article><h3>Plan for access</h3><p>Ask what accommodations, language options, and practical supports would make participation possible.</p></article><article><h3>Reassess over time</h3><p>Fit may change as a client's recovery, preferences, and needs evolve.</p></article></div>`+actionButtons([{t:'Review Safety Practices →',a:'placement-finish'}]))}
function placementFinish(){mark(3);safetyScene()}


// Section 5: Safety, agreements and group confidentiality.
function safetyScene(){visit(4);closeModal();person('Daniel','Daniel wants you to consider what makes a group feel safe enough to participate.',IMG.daniel,IMG.training,'safety-intro')}
function safetyIntro(){openModal(heading('Creating a Safe Group Environment',IMG.danielHead)+`<p>For many clients, attending a group means sharing space with strangers and deciding what to disclose. Emotional safety develops through clear expectations, respectful facilitation, and consistent boundaries, not by requiring personal stories.</p><p>A group can become an important source of belonging, but safety is an ongoing practice. The facilitator must notice when members feel excluded, pressured, interrupted, or threatened.</p><div class="guidance"><strong>Remember:</strong> A counselor can explain privacy expectations but cannot promise that other members will never repeat what they hear. Qualified staff should explain the legal and organizational limits of confidentiality.</div>`+actionButtons([{t:'Explore Group Agreements →',a:'safety-agreements'}]))}
function safetyAgreements(){openModal(heading('Group Agreements: Building Trust',IMG.danielHead)+`<p>Before the group begins, the facilitator explains expectations and invites members to discuss them. The purpose is to create a predictable space, not a set of punishments.</p><div class="info-cards">
<article><span class="benefit-icon" aria-hidden="true">🔒</span><h3>Privacy and confidentiality</h3><p>Do not identify other members or share their stories outside the group. Explain the limits of privacy honestly, including relevant legal and safety exceptions.</p></article>
<article><span class="benefit-icon" aria-hidden="true">🗣️</span><h3>Respectful communication</h3><p>Speak from personal experience, avoid insults and threats, and give others room to finish speaking.</p></article>
<article><span class="benefit-icon" aria-hidden="true">🤲</span><h3>Choice and participation</h3><p>Invite participation without forcing disclosures. A member may need time to feel comfortable speaking.</p></article>
<article><span class="benefit-icon" aria-hidden="true">🚦</span><h3>Healthy boundaries</h3><p>Agree on time, attendance, contact outside group, and how to address behavior that disrupts safety.</p></article>
<article><span class="benefit-icon" aria-hidden="true">🧭</span><h3>Responding to concerns</h3><p>Explain how members can raise questions privately and when a facilitator must intervene or involve clinical support.</p></article>
<article><span class="benefit-icon" aria-hidden="true">🌎</span><h3>Inclusive belonging</h3><p>Respect differences in language, culture, identity, recovery experience, communication, and accessibility needs.</p></article>
</div><div class="guidance"><strong>A useful distinction:</strong> A group agreement sets shared expectations. The treatment program must also follow applicable privacy laws, professional duties, and safety procedures.</div>`+actionButtons([{t:'See How Agreements Work →',a:'safety-privacy'}]))}
function safetyPrivacy(){openModal(heading('Confidentiality in a Group',IMG.danielHead)+`<p>Group members may learn sensitive information about one another. The facilitator should explain what the program is required to protect, what group members agree to protect, and the limits of what can be guaranteed.</p><div class="info-cards"><article><h3>What the counselor can do</h3><p>Review privacy expectations, model discretion, respond to potential breaches, document and report concerns according to policy, and consult appropriate staff.</p></article><article><h3>What the counselor cannot promise</h3><p>That every participant will keep every discussion private after leaving the room.</p></article></div><p><strong>Example:</strong> A member says they saw another participant at a recovery group. Even without repeating that person's story, identifying their attendance may expose private information.</p><div class="guidance">Confidentiality rules for substance use disorder records, including 42 CFR Part 2 where applicable, are important. Exact obligations and exceptions depend on the program and circumstances; ask a supervisor when uncertain.</div>`+actionButtons([{t:'Practice Responding to Group Situations →',a:'safety-quiz'}]))}
const safetyCases=[
{name:'Jamal',stem:'Jamal is new to group therapy. He says, “I’m not ready to tell everyone what happened to me. Can I just listen today?”',question:'What response best protects emotional safety while welcoming participation?',choices:['Tell Jamal that everyone must share a personal story during the first meeting.','Invite Jamal to listen, explain participation expectations, and check in about what would help him feel comfortable.','Ask another member to describe Jamal’s situation to break the ice.','Tell Jamal that silence means group treatment is not right for him.'],answer:1,why:'Offering choice and clarifying expectations promotes trust. A first session should not force disclosure as proof of commitment.'},
{name:'Tanya',stem:'Tanya interrupts another participant several times. The interrupted member stops talking and looks uncomfortable.',question:'What is a helpful first response from the facilitator?',choices:['Ignore the interruptions because Tanya means well.','Ask the interrupted member to share more even if they appear uncomfortable.','Calmly remind the group about turn-taking and invite the interrupted member to continue if they wish.','Tell Tanya she is no longer permitted to speak in the group.'],answer:2,why:'Consistent, respectful boundaries protect everyone’s opportunity to participate without shaming Tanya or pressuring the other member.'},
{name:'Krishna',stem:'After group, Krishna overhears one member telling a friend that another person attended the session and describing what that person said.',question:'What should the counselor do after learning of the possible privacy breach?',choices:['Address the concern promptly under program policy, consult appropriate staff, and reinforce confidentiality expectations.','Assure the affected member that everything said in group is legally guaranteed to remain private.','Repeat the disclosure to the group so everyone knows the details.','Do nothing because members, not the counselor, are responsible for privacy.'],answer:0,why:'A potential breach requires an appropriate response. The counselor should not promise a level of control over peers that the program cannot guarantee.'},
{name:'Group safety',stem:'During a discussion, one member threatens another, and several people look frightened.',question:'What should the facilitator prioritize?',choices:['Continue the planned activity to avoid interrupting the group.','Ask members to vote on whether the threat was serious.','Invite the threatened member to explain why the situation upset them.','Interrupt the threatening behavior, follow safety procedures, and obtain appropriate assistance.'],answer:3,why:'Immediate physical and emotional safety takes priority over the planned group activity. Staff should respond within training, role, and program procedures.'}
];
let safetyIndex=0;
function safetyQuiz(){safetyIndex=0;showSafetyCase()}
function showSafetyCase(){const c=safetyCases[safetyIndex];openModal(caseTitle(`Group Safety: Situation ${safetyIndex+1} of ${safetyCases.length}`)+caseDescription(c.name,c.stem,c.question)+`<div class="option-grid">${c.choices.map((x,i)=>`<button type="button" data-safety-choice="${i}">${String.fromCharCode(65+i)}. ${x}</button>`).join('')}</div><div id="safetyFeedback" aria-live="polite"></div>`)}
function answerSafety(i){const c=safetyCases[safetyIndex],correct=i===c.answer;const buttons=mc.querySelectorAll('[data-safety-choice]');buttons.forEach(b=>{b.disabled=correct;b.classList.remove('correct','incorrect');if(correct&&Number(b.dataset.safetyChoice)===c.answer)b.classList.add('correct')});if(!correct)mc.querySelector(`[data-safety-choice="${i}"]`)?.classList.add('incorrect');document.getElementById('safetyFeedback').innerHTML=`<div class="feedback-card ${correct?'correct':'incorrect'}" role="status"><strong>${correct?'Correct':'Try again.'}</strong><p>${correct?c.why:'Think about the client’s needs, autonomy, safety, and the purpose of the group. Select another response.'}</p></div>`+(correct?actionButtons([{t:safetyIndex===safetyCases.length-1?'Review Group Safety Principles →':'Next Group Situation →',a:'safety-next'}]):'')}
function safetyNext(){safetyIndex++;if(safetyIndex<safetyCases.length)showSafetyCase();else safetyWrap()}
function safetyWrap(){openModal(heading('Safety Is Everyone’s Work',IMG.danielHead)+`<p>A safe group is not one where difficult feelings never occur. It is a group where members know the expectations, their choices are respected, and a qualified facilitator addresses concerns consistently.</p><div class="info-cards"><article><h3>Set expectations early</h3><p>Explain confidentiality, respectful communication, participation, and boundaries before problems arise.</p></article><article><h3>Invite, don't force</h3><p>Give people time and support to participate while maintaining clear norms.</p></article><article><h3>Act on threats and breaches</h3><p>Follow organizational procedures, seek supervision, and prioritize safety.</p></article><article><h3>Keep building trust</h3><p>Revisit agreements and repair harm when the group encounters conflict.</p></article></div>`+actionButtons([{t:'Guiding the Group →',a:'safety-finish'}]))}
function safetyFinish(){mark(4);facilitationScene()}


// Section 6: The Counselor's Role — group facilitation in practice.
function facilitationScene(){visit(5);closeModal();person('Daniel','Daniel will help you practice guiding a group while making space for every member.',IMG.daniel,IMG.training,'facilitation-intro')}
function facilitationIntro(){openModal(heading('The Counselor’s Role in Group Therapy',IMG.danielHead)+`<p>A facilitator does more than lead a series of individual conversations in the same room. They help members learn with and from one another, while maintaining the purpose, boundaries, and safety of the group.</p><p>Effective facilitation involves listening carefully, inviting balanced participation, recognizing patterns between members, and knowing when to intervene or when to allow helpful peer discussion to continue.</p><div class="guidance"><strong>Scope of practice:</strong> As a CDCA, you may help support groups under appropriate supervision and within your credentials, training, and program policies. Leading clinical group psychotherapy, making independent placement decisions, and handling emergencies require appropriately qualified personnel and procedures.</div>`+actionButtons([{t:'Explore Facilitation Skills →',a:'facilitation-skills'}]))}
const facilitationSkillCards=[
 ['🗣️','Invite participation','Make room for a range of voices without requiring personal disclosure.','“We have heard a few perspectives. Does anyone else want to add something?”'],
 ['👂','Listen and reflect','Use brief reflections and summaries to show understanding and connect contributions.','“I’m hearing that support matters, but asking for it can feel difficult.”'],
 ['🤝','Connect members','Encourage constructive member-to-member conversation instead of routing everything through the leader.','“What did you hear in what Jamal shared that relates to your experience?”'],
 ['🧭','Keep the group focused','Gently bring discussion back to the purpose and agreements of the session.','“Let’s connect that back to coping with cravings this week.”'],
 ['🛡️','Protect safety and dignity','Address interruptions, shaming, boundary issues, and safety concerns promptly and respectfully.','“We can disagree while still speaking respectfully. Let’s slow down.”'],
 ['🌍','Attend to differences','Stay curious about accessibility, language, culture, and how each person prefers to participate.','“What would help you participate in a way that works for you?”']
];
function facilitationSkills(){openModal(heading('Six Skills of a Group Facilitator',IMG.danielHead)+`<p>Group leadership is a balance of structure and flexibility. Compare these practical skills and examples.</p><div class="info-cards">${facilitationSkillCards.map(([icon,title,desc,example])=>`<article><h3>${icon} ${title}</h3><p>${desc}</p><p><strong>What it might sound like:</strong> ${example}</p></article>`).join('')}</div><div class="guidance">Good facilitation is not about making every person speak the same amount. It is about offering equitable opportunities and respecting each member’s needs and boundaries.</div>`+actionButtons([{t:'Watch a Group Discussion →',a:'facilitation-observe'}]))}
function facilitationObserve(){openModal(heading('Noticing the Group, Not Just One Person',IMG.danielHead)+`<p>Imagine a professionally facilitated recovery group. Tanya speaks confidently about her progress and begins interrupting others. Jamal starts to respond but stops. Krishna remains quiet and looks toward the door.</p><p>There is no need to assume what Jamal or Krishna is thinking. The facilitator can observe who has had a chance to speak, invite rather than pressure, and redirect interruptions in a respectful way.</p>${fullbodyLineup()}<div class="info-cards"><article><h3>Leader-centered pattern</h3><p>Each person talks only to the counselor. The counselor responds to every statement, and peers rarely interact.</p></article><article><h3>Group-centered pattern</h3><p>Members hear and respond thoughtfully to one another. The counselor guides, summarizes, and intervenes when needed.</p></article></div><p><strong>Key idea:</strong> A healthy group is not leader-free; the facilitator creates the conditions for useful, safe interaction between members.</p>`+actionButtons([{t:'Practice Facilitation Decisions →',a:'facilitation-quiz'}]))}
const facilitationCases=[
 {name:'Jamal',stem:'After Tanya describes a coping strategy, Jamal begins to speak, pauses, and says, “Never mind. I’m not ready.”',question:'What would be the most supportive response?',choices:['Ask Jamal to tell the group his history so he can get used to speaking.','Respect his choice, acknowledge that he can participate at his own pace, and leave the invitation open.','Move on without acknowledging him because discussing hesitation could embarrass him.','Ask Tanya to explain why Jamal should feel comfortable talking.'],answer:1,why:'A welcoming invitation paired with freedom not to disclose supports psychological safety. The leader can check in without turning participation into pressure.'},
 {name:'Tanya',stem:'Tanya has offered several helpful ideas, but she frequently answers before others finish speaking. Two members have stopped contributing.',question:'What should the facilitator do next?',choices:['Thank Tanya for her enthusiasm, remind everyone about taking turns, and invite other perspectives.','Publicly label Tanya as disruptive and ask her not to speak for the rest of the session.','Let Tanya continue because enthusiasm is evidence that the group is working.','Ask the quiet members to explain why they have not contributed.'],answer:0,why:'Acknowledging Tanya’s positive intent while reinforcing turn-taking supports the whole group without shaming her or forcing others to speak.'},
 {name:'Connecting members',stem:'A member says, “When I’m stressed, I want to isolate myself.” Another member nods and says, “That happens to me too.”',question:'How can the facilitator help the group learn from one another?',choices:['Explain the psychology of isolation for the remainder of the session.','Tell both members which coping strategy they need to use.','Invite members to discuss what has helped them reconnect when they notice themselves withdrawing.','Change the subject because members should not respond to each other directly.'],answer:2,why:'Inviting peers to explore and share their own experiences supports mutual learning while the leader maintains the therapeutic focus.'},
 {name:'Conflict between members',stem:'Two group members disagree about whether a particular recovery strategy is helpful. Their voices are getting louder, but no one has made a threat.',question:'What is the most appropriate first step?',choices:['End the session immediately whenever disagreement occurs.','Choose which member is right and tell the other to accept it.','Ignore the rising tension because conflict always resolves itself.','Slow the exchange, reinforce respectful discussion, and help members speak from their own experiences.'],answer:3,why:'Disagreement can be an opportunity to practice healthy communication when it remains safe and respectful. The facilitator must watch for escalation and act according to group policy.'},
 {name:'Limits of the CDCA role',stem:'During a group you are helping support, a member reports symptoms that may require urgent clinical assessment. The supervising clinician is available.',question:'What should you do?',choices:['Make an independent diagnosis and decide the treatment plan for the member.','Follow the program’s safety procedures and promptly involve the supervising clinician or other qualified staff.','Ask group members to vote on whether the symptoms need attention.','Continue the activity and discuss the concern at the end of the week.'],answer:1,why:'Recognizing a possible safety or clinical concern and involving qualified staff is appropriate. The CDCA should remain within training, scope, supervision, and established protocols.'}
];
let facilitationIndex=0;
function facilitationQuiz(){facilitationIndex=0;showFacilitationCase()}
function showFacilitationCase(){const c=facilitationCases[facilitationIndex];openModal(caseTitle(`Facilitation Decision ${facilitationIndex+1} of ${facilitationCases.length}`)+caseDescription(c.name,c.stem,c.question,facilitationIndex===0)+`<div class="option-grid">${c.choices.map((x,i)=>`<button type="button" data-facilitation-choice="${i}">${String.fromCharCode(65+i)}. ${x}</button>`).join('')}</div><div id="facilitationFeedback" aria-live="polite"></div>`)}
function answerFacilitation(i){const c=facilitationCases[facilitationIndex],correct=i===c.answer;const buttons=mc.querySelectorAll('[data-facilitation-choice]');buttons.forEach(b=>{b.disabled=correct;b.classList.remove('correct','incorrect');if(correct&&Number(b.dataset.facilitationChoice)===c.answer)b.classList.add('correct')});if(!correct)mc.querySelector(`[data-facilitation-choice="${i}"]`)?.classList.add('incorrect');document.getElementById('facilitationFeedback').innerHTML=`<div class="feedback-card ${correct?'correct':'incorrect'}" role="status"><strong>${correct?'Correct':'Try again.'}</strong><p>${correct?c.why:'Think about the client’s needs, autonomy, safety, and the purpose of the group. Select another response.'}</p></div>`+(correct?actionButtons([{t:facilitationIndex===facilitationCases.length-1?'Review Facilitation Principles →':'Next Facilitation Decision →',a:'facilitation-next'}]):'')}
function facilitationNext(){facilitationIndex++;if(facilitationIndex<facilitationCases.length)showFacilitationCase();else facilitationWrap()}
function facilitationWrap(){openModal(heading('Supporting the Whole Group',IMG.danielHead)+`<p>Facilitators build conditions for safety, shared learning, and balanced engagement. They listen closely to each client <em>and</em> pay attention to how members interact with one another.</p><div class="info-cards"><article><h3>Guide without dominating</h3><p>Make room for peer support and purposeful discussion.</p></article><article><h3>Invite without pressuring</h3><p>Honor each member’s comfort and readiness to share.</p></article><article><h3>Respond with respect</h3><p>Interrupt harmful behavior while protecting everyone’s dignity.</p></article><article><h3>Know your role</h3><p>Bring clinical decisions and safety concerns to appropriately qualified staff.</p></article></div>`+actionButtons([{t:'Handling Challenging Sessions →',a:'facilitation-finish'}]))}
function facilitationFinish(){mark(5);challengesScene()}


// SECTION 7 · CHALLENGES IN GROUP THERAPY
function challengesScene(){visit(6);closeModal();person('Daniel','Daniel will help you respond to challenging moments in a recovery group.',IMG.daniel,IMG.group,'challenges-intro')}
function challengesIntro(){openModal(heading('Challenges in Group Therapy',IMG.danielHead)+`<p>Groups can offer connection, encouragement, and meaningful feedback. They can also bring uncertainty, strong emotions, interruptions, disagreements, and disclosures that require care.</p><p>Rather than judging a member as “difficult,” a facilitator asks: <strong>What is happening in the group, what does this person need, and what response would protect safety while supporting recovery?</strong></p><div class="guidance"><strong>Your role as a CDCA:</strong> Practice respectful communication, observe group dynamics, and support the established group plan under appropriate supervision. Refer clinical assessments, treatment changes, imminent safety concerns, and decisions outside your credentials to qualified staff and program procedures.</div>`+actionButtons([{t:'Explore Common Challenges →',a:'challenges-types'}]))}
const challengeCards=[
 ['🗣️','One member dominates','Interruptions can limit participation. Affirm helpful intent, set a consistent boundary, and invite other perspectives.'],
 ['🤝','Disagreement becomes personal','Different perspectives are normal; insults and threats are not. Redirect toward respectful dialogue and intervene for safety.'],
 ['🔒','Members worry about privacy','Explain the group agreement and the limits of confidentiality. Follow program procedures when privacy is breached.'],
 ['💬','Someone is hesitant to share','Acknowledge uncertainty and provide choices without demanding a personal disclosure.'],
 ['🧭','Renewed substance use is disclosed','Respond without shame, check for immediate safety needs, and involve the qualified treatment team for assessment and follow-up.'],
 ['🌿','Emotions become overwhelming','Slow the discussion, help restore safety, and involve qualified clinical staff when needed.']
];
function challengesTypes(){openModal(heading('Common Challenges and Helpful Responses',IMG.danielHead)+`<p>Notice how each response supports both the individual member and the whole group.</p><div class="info-cards">${challengeCards.map(([icon,title,desc])=>`<article><h3>${icon} ${title}</h3><p>${desc}</p></article>`).join('')}</div><p>These are not scripts that work in every situation. The group agreement, risk level, client needs, and direction from qualified staff guide the next step.</p>`+actionButtons([{t:'Observe a Challenging Session →',a:'challenges-observe'}]))}
function challengesObserve(){openModal(heading('A Complicated Group Session',IMG.danielHead)+`<p>Imagine you're supporting a recovery group at Harbor Point with the qualified group facilitator.</p><div class="client-lineup" aria-label="Members of the group"><div><img src="${IMG.jamal}" alt="Jamal"><strong>Jamal</strong></div><div><img src="${IMG.tanya}" alt="Tanya"><strong>Tanya</strong></div><div><img src="${IMG.krishna}" alt="Krishna"><strong>Krishna</strong></div></div><div class="info-cards"><article><h3>Jamal</h3><p>He is new, speaks softly, and stops sharing when others jump in.</p></article><article><h3>Tanya</h3><p>She means well but offers advice before people finish describing their experiences.</p></article><article><h3>Krishna</h3><p>He seems distracted. Later he says, “I used again this weekend. I wasn't sure I should say anything here.”</p></article></div><p>The group is affected by how each person responds. Strong leadership means protecting safety, maintaining dignity, and using opportunities for supportive peer connection, not turning Krishna's disclosure into a public interrogation.</p>`+actionButtons([{t:'Practice Group Responses →',a:'challenges-quiz'}]))}
const challengeCases=[
 {name:'Tanya and Jamal',stem:'Jamal starts describing what helped him attend his first meeting. Tanya interrupts: “You just need to do what worked for me!” Jamal stops talking.',question:'What should the facilitator do?',choices:['Ask Jamal to repeat his story more loudly so he will be heard.','Thank Tanya for wanting to help, remind the group to let each person finish, and invite Jamal to continue if he wishes.','Tell Tanya she cannot participate for the rest of the meeting.','Ignore the interruption and move on to the next topic.'],answer:1,why:'A clear, respectful boundary makes space for Jamal without shaming Tanya or forcing him to disclose.'},
 {name:'Krishna',stem:'Krishna says, “I used again this weekend. I was scared to tell you.” Another member mutters, “Then you clearly are not trying.”',question:'What is the most appropriate immediate group response?',choices:['Ask Krishna to provide every detail of his substance use to prove he is being honest.','Allow the group to debate whether Krishna deserves another chance.','Stop the judgmental comment, acknowledge Krishna’s courage in speaking, and follow the program’s safety and clinical follow-up process.','Promise the group that Krishna’s substance use has no safety implications.'],answer:2,why:'The response reduces shame while recognizing that renewed use may require prompt assessment, safety planning, and treatment-team follow-up. Never make promises that bypass clinical review.'},
 {name:'Disagreement',stem:'Two members disagree about whether attending a peer-support meeting helps recovery. One says, “Your way is stupid.” Voices begin to rise.',question:'What should happen next?',choices:['Intervene to stop the insult, restate respectful communication expectations, and refocus on different experiences without declaring one recovery path correct for everyone.','Choose whichever member has been in recovery longer as the winner of the debate.','Allow the argument to escalate because conflict always produces growth.','End the group permanently because disagreement occurred.'],answer:0,why:'Disagreement can be explored, but personal attacks need a boundary. The facilitator can preserve dignity and redirect the discussion.'},
 {name:'Confidentiality',stem:'A member tells the group that someone posted about another client’s recovery story on social media without permission.',question:'What is the best next step?',choices:['Assure everyone that confidentiality can be guaranteed from now on.','Ask everyone to guess who made the post.','Say the group agreement is only a suggestion and there is nothing to do.','Address the privacy concern promptly, avoid discussing identifying details unnecessarily, and follow the program’s reporting and confidentiality procedures.'],answer:3,why:'Confidentiality concerns warrant prompt, careful action. Group agreements are important, but leaders cannot guarantee that peers will always keep information private.'},
 {name:'Safety and scope',stem:'After a distressing discussion, a member says they may hurt themselves tonight. Several peers urge the facilitator to keep it “just between us.”',question:'What is the appropriate next step?',choices:['Honor the request for secrecy and wait until the next group meeting.','Treat the statement as an urgent safety concern, stay with the person as appropriate, and immediately follow the program’s emergency and qualified-clinician escalation procedures.','Ask the group to vote on whether the person really means it.','Tell the member to figure out a plan alone because the group is not individual counseling.'],answer:1,why:'Potential self-harm calls for immediate safety response through established procedures and appropriately qualified staff. Confidentiality is not a reason to ignore an imminent risk.'}
];
let challengeIndex=0;
function challengesQuiz(){challengeIndex=0;showChallengeCase()}
function showChallengeCase(){const c=challengeCases[challengeIndex];openModal(caseTitle(`Group Decision ${challengeIndex+1} of ${challengeCases.length}`)+caseDescription(c.name,c.stem,c.question)+`<div class="option-grid">${c.choices.map((x,i)=>`<button type="button" data-challenge-choice="${i}"><strong>${String.fromCharCode(65+i)}.</strong> ${x}</button>`).join('')}</div><div id="challengeFeedback" aria-live="polite"></div>`)}
function answerChallenge(i){const c=challengeCases[challengeIndex],correct=i===c.answer;const buttons=mc.querySelectorAll('[data-challenge-choice]');buttons.forEach(b=>{b.disabled=correct;b.classList.remove('correct','incorrect');if(correct&&Number(b.dataset.challengeChoice)===c.answer)b.classList.add('correct')});if(!correct)mc.querySelector(`[data-challenge-choice="${i}"]`)?.classList.add('incorrect');document.getElementById('challengeFeedback').innerHTML=`<div class="feedback-card ${correct?'correct':'incorrect'}" role="status"><strong>${correct?'Correct':'Try again.'}</strong><p>${correct?c.why:'Think about the client’s needs, autonomy, safety, and the purpose of the group. Select another response.'}</p></div>`+(correct?actionButtons([{t:challengeIndex===challengeCases.length-1?'Review Group Challenges →':'Next Group Decision →',a:'challenges-next'}]):'')}
function challengesNext(){challengeIndex++;if(challengeIndex<challengeCases.length)showChallengeCase();else challengesWrap()}
function challengesWrap(){openModal(heading('Responding With Confidence and Care',IMG.danielHead)+`<p>Effective group work isn't about avoiding every difficult moment. It is about recognizing challenges early, responding respectfully, and getting additional support when necessary.</p><div class="info-cards"><article><h3>Observe the whole group</h3><p>Notice who is participating, who is withdrawing, and how members affect one another.</p></article><article><h3>Set boundaries with care</h3><p>Redirect interruptions, insults, and unsafe interactions without humiliating members.</p></article><article><h3>Respond without shame</h3><p>A disclosure of renewed substance use is an opportunity for support and appropriate follow-up, not public blame.</p></article><article><h3>Know when to escalate</h3><p>Follow program procedures and involve qualified professionals when risks or clinical decisions arise.</p></article></div>`+actionButtons([{t:'Therapy in Practice →',a:'challenges-finish'}]))}
function challengesFinish(){mark(6);practiceScene()}


// SECTION 8 · GROUP THERAPY IN PRACTICE
function practiceScene(){visit(7);closeModal();person('Daniel','Daniel is ready to guide you through a group session.',IMG.daniel,IMG.group,'practice-intro')}
function practiceIntro(){openModal(heading('Group Therapy in Practice',IMG.danielHead)+`<p>Today, you are observing a recovery group at Harbor Point alongside a qualified group facilitator. Jamal, Tanya, and Krishna are attending. You will make a series of decisions about how to support the group.</p><div class="client-lineup" aria-label="Members of the group"><div><img src="${IMG.jamal}" alt="Jamal"><strong>Jamal</strong></div><div><img src="${IMG.tanya}" alt="Tanya"><strong>Tanya</strong></div><div><img src="${IMG.krishna}" alt="Krishna"><strong>Krishna</strong></div></div><p>As a CDCA, your role is to observe, communicate respectfully, reinforce the agreed plan, and involve your supervisor or qualified clinical staff for concerns outside your scope. These scenarios do not replace clinical training or supervision.</p><div class="guidance"><strong>Your goal:</strong> Think about the effects of each response on both the person speaking and the rest of the group. There is time to make mistakes and learn from feedback.</div>`+actionButtons([{t:'Begin the Group Session →',a:'practice-quiz'}]))}
const practiceCases=[
 {name:'Before the meeting',stem:'Jamal is new and tells you quietly, “If everyone expects me to share my whole story, I might leave.”',question:'What is the best supportive response?',choices:['“Everyone has to share personal details on the first day.”','“I hear that sharing feels uncomfortable. Let’s review what participation looks like, and you can choose what you feel ready to share.”','“I will guarantee no one ever repeats anything said here.”','“It would be easier if you skipped this session.”'],answer:1,why:'Acknowledge anxiety, explain expectations honestly, and support voluntary disclosure without promising absolute confidentiality.'},
 {name:'Opening the discussion',stem:'The facilitator asks members what has helped them stay engaged in treatment. Tanya immediately begins telling Jamal exactly what he should do.',question:'How can the facilitator make room for everyone?',choices:['Let Tanya continue until she runs out of advice.','Tell Tanya that her experiences do not matter.','Appreciate Tanya’s willingness to contribute, reinforce taking turns, and invite members to share their own experiences.','Require Jamal to respond to Tanya’s advice in front of the group.'],answer:2,why:'Recognize Tanya’s positive intent, preserve the group norm, and foster peer discussion without putting Jamal on the spot.'},
 {name:'A useful connection',stem:'Jamal says, “I thought I was the only one embarrassed about being here.” Several members nod.',question:'Which facilitator response would strengthen the therapeutic value of this moment?',choices:['“It sounds like several of you have felt alone. Would anyone like to share what helped you feel more connected?”','“Let’s stop talking about feelings and focus on the worksheet.”','“Jamal, tell us exactly why you are embarrassed.”','“Everyone in treatment feels exactly the same way.”'],answer:0,why:'A reflection and open invitation can build connection and normalize shared experiences without assuming everyone feels the same.'},
 {name:'Krishna shares something difficult',stem:'Krishna says, “I used over the weekend. I thought about staying home today.” Another member responds, “I’m disappointed in you.”',question:'What is the most appropriate immediate response?',choices:['Invite the group to decide what consequence Krishna should receive.','Ask Krishna to describe the substance, amount, and exact timeline publicly.','Change the subject so no one feels uncomfortable.','Set a respectful boundary, thank Krishna for being open, and arrange appropriate safety assessment and follow-up with the qualified treatment team.'],answer:3,why:'Respond without shaming. A disclosure of renewed use calls for support and, as indicated, private clinical and safety follow-up, not a public interrogation.'},
 {name:'The discussion grows tense',stem:'Tanya says, “Anyone who uses again clearly isn’t serious.” Jamal looks down, and another person raises their voice.',question:'What should the facilitator do next?',choices:['Allow personal attacks because they demonstrate accountability.','Interrupt the judgmental exchange, reaffirm respectful group expectations, and redirect toward supportive discussion.','Ask the quietest member to settle the argument.','End all group therapy for this set of clients.'],answer:1,why:'Clear and calm boundaries protect the group while allowing members to explore different experiences without humiliation.'},
 {name:'Privacy outside the room',stem:'After the session, Jamal reports that someone has been discussing Krishna’s disclosure with people who do not attend the group.',question:'What is the best next step?',choices:['Ask Jamal to post a public warning online.','Tell Jamal that nothing can be done because group members are not staff.','Take the concern seriously, limit further disclosure of identifying details, and follow the program’s confidentiality and incident-response procedures.','Promise Jamal that no breach can ever occur again.'],answer:2,why:'Group leaders should address privacy concerns promptly under applicable policies and laws. Never promise complete control of other members’ behavior.'},
 {name:'Closing the session',stem:'As the group ends, Jamal says he might come back next week. Tanya says she learned to listen more. Krishna asks to speak privately with a clinician.',question:'Which closing response best supports the group?',choices:['Summarize members’ progress without sharing anyone’s private details unnecessarily, reinforce options for continued support, and help Krishna connect with qualified staff.','Explain that only members who stayed abstinent made progress today.','Guarantee everyone will recover if they keep attending.','Require each member to make a public promise about next week.'],answer:0,why:'A balanced closing highlights strengths and choices while providing appropriate follow-up and staying within scope.'}
];
let practiceIndex=0;
function practiceQuiz(){practiceIndex=0;showPracticeCase()}
function showPracticeCase(){const c=practiceCases[practiceIndex];openModal(caseTitle(`Group Session · Decision ${practiceIndex+1} of ${practiceCases.length}`)+caseDescription(c.name,c.stem,c.question,practiceIndex===1||practiceIndex===4)+`<div class="option-grid">${c.choices.map((x,i)=>`<button type="button" data-practice-choice="${i}"><strong>${String.fromCharCode(65+i)}.</strong> ${x}</button>`).join('')}</div><div id="practiceFeedback" aria-live="polite"></div>`)}
function answerPractice(i){const c=practiceCases[practiceIndex],correct=i===c.answer;const buttons=mc.querySelectorAll('[data-practice-choice]');buttons.forEach(b=>{b.disabled=correct;b.classList.remove('correct','incorrect');if(correct&&Number(b.dataset.practiceChoice)===c.answer)b.classList.add('correct')});if(!correct)mc.querySelector(`[data-practice-choice="${i}"]`)?.classList.add('incorrect');document.getElementById('practiceFeedback').innerHTML=`<div class="feedback-card ${correct?'correct':'incorrect'}" role="status"><strong>${correct?'Correct':'Try again.'}</strong><p>${correct?c.why:'Think about the client’s needs, autonomy, safety, and the purpose of the group. Select another response.'}</p></div>`+(correct?actionButtons([{t:practiceIndex===practiceCases.length-1?'Reflect on the Session →':'Continue the Session →',a:'practice-next'}]):'')}
function practiceNext(){practiceIndex++;if(practiceIndex<practiceCases.length)showPracticeCase();else practiceDebrief()}
function practiceDebrief(){openModal(heading('The Session Is Over. What Did You Notice?',IMG.danielHead)+`<p>You observed how one member’s actions can change the experience of everyone in a group. Good facilitation makes room for peer connection while maintaining safety, respect, and appropriate boundaries.</p><div class="info-cards"><article><img class="debrief-head" src="${casePhoto.Jamal}" alt="Jamal"><h3>Jamal</h3><p>Needed a choice about participation and a chance to feel understood.</p></article><article><img class="debrief-head" src="${casePhoto.Tanya}" alt="Tanya"><h3>Tanya</h3><p>Brought enthusiasm, but benefited from boundaries and opportunities to listen.</p></article><article><img class="debrief-head" src="${casePhoto.Krishna}" alt="Krishna"><h3>Krishna</h3><p>Needed a nonjudgmental response and support from qualified clinical staff.</p></article></div><p>Now connect the ideas from group therapy to your own experiences and your future work.</p>`+actionButtons([{t:'Complete Your Personal Reflections →',a:'practice-reflections'}]))}
const reflectionPrompts=[
 ['Connection and Belonging','Think of a group you have belonged to (e.g., a class, team, club, work group, or another setting). What made it easier or harder to feel accepted? How could a counselor use that insight to help group members feel included?'],
 ['Being Heard','Describe a time when someone interrupted, gave unsolicited advice, or really listened to you. How did it affect your willingness to participate? What would you do differently as a group facilitator?'],
 ['Responding Without Judgment','Imagine you were Krishna and had to share a difficult setback with a group. What would you hope the facilitator and other members would say or do? Why?'],
 ['Your Next Step','Of the group facilitation skills introduced this week, which would be most challenging for you to practice? Identify one concrete step you could take to improve that skill.']
];
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function practiceReflections(){let responses=Array.isArray(state.reflections)?state.reflections:["","","",""];openModal(heading('Personal Reflections · Week 12',IMG.danielHead)+`<p>Answer all four prompts in your own words. You can use everyday examples; you do not need to disclose sensitive personal experiences.</p><div class="reflection-form">${reflectionPrompts.map(([title,prompt],i)=>`<div class="reflection-item" style="margin:15px 0;padding:15px;border:1px solid #d8e1e6;border-radius:14px;background:#f9fbfb"><label for="reflection${i}" style="display:block;font-weight:800;color:#17384e;margin-bottom:8px">${i+1}. ${title}</label><p style="margin:5px 0 10px">${prompt}</p><textarea id="reflection${i}" data-reflection="${i}" rows="5" style="width:100%;min-height:110px;border:2px solid #8da7b6;border-radius:9px;padding:11px;font:inherit" placeholder="Write your reflection here...">${escapeHTML(responses[i]||'')}</textarea></div>`).join('')}</div><div class="guidance" id="reflectionStatus" aria-live="polite"></div>`+actionButtons([{t:'Download My Reflection PDF',a:'practice-download'},{t:'Complete Module 12 →',a:'practice-finish',secondary:true}]))}
// Small self-contained PDF writer: works offline and does not rely on remote JavaScript.
async function downloadModule12PDF(){const prompts=reflectionPrompts.map(([title,question],i)=>['Personal Reflection '+(i+1),question,(state.reflections||[])[i]||'']);const pageW=1275,pageH=1650,margin=92,contentW=pageW-margin*2;const pages=[];let canvas,ctx,y;const makePage=()=>{canvas=document.createElement('canvas');canvas.width=pageW;canvas.height=pageH;ctx=canvas.getContext('2d');ctx.fillStyle='#faf6ef';ctx.fillRect(0,0,pageW,pageH);ctx.fillStyle='#243746';ctx.fillRect(0,0,pageW,166);ctx.fillStyle='#d7a74a';ctx.fillRect(0,166,pageW,10);ctx.fillStyle='#fff';ctx.font='700 38px Inter, Arial, sans-serif';ctx.fillText('Group Therapy, Part 1',margin,76);ctx.font='600 22px Inter, Arial, sans-serif';ctx.fillStyle='#dce9ee';ctx.fillText('Harbor Point · Module 12 Reflection Report',margin,128);y=232;ctx.font='500 19px Inter, Arial, sans-serif';ctx.fillStyle='#354f5c';ctx.fillText(`Completed: ${new Date().toLocaleDateString()} ${new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}`,margin,y);y+=58};const wrap=(text,font,maxWidth)=>{ctx.font=font;const words=(text||'No response recorded.').toString().split(/\s+/);const lines=[];let line='';for(const word of words){const test=line?line+' '+word:word;if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=word}else line=test}if(line)lines.push(line);return lines};const add=async()=>{await new Promise(r=>canvas.toBlob(b=>{pages.push(b);r()},'image/jpeg',.9))};makePage();for(const [title,prompt,response] of prompts){const t=wrap(title,'800 25px Inter, Arial, sans-serif',contentW-48),p=wrap(prompt,'700 19px Inter, Arial, sans-serif',contentW-48),r=wrap(response,'500 21px Inter, Arial, sans-serif',contentW-48);const boxH=38+t.length*33+12+p.length*28+18+r.length*31+32;if(y+boxH>pageH-90){await add();makePage()}ctx.fillStyle='#fffdfa';roundRect(ctx,margin,y,contentW,boxH,20,true,false);ctx.strokeStyle='#dfd5c7';ctx.lineWidth=3;roundRect(ctx,margin,y,contentW,boxH,20,false,true);let yy=y+38;ctx.fillStyle='#243746';ctx.font='800 25px Inter, Arial, sans-serif';t.forEach(line=>{ctx.fillText(line,margin+24,yy);yy+=33});yy+=4;ctx.fillStyle='#496173';ctx.font='700 19px Inter, Arial, sans-serif';p.forEach(line=>{ctx.fillText(line,margin+24,yy);yy+=28});yy+=10;ctx.fillStyle='#263238';ctx.font='500 21px Inter, Arial, sans-serif';r.forEach(line=>{ctx.fillText(line,margin+24,yy);yy+=31});y+=boxH+24}await add();const imgs=[];for(const b of pages)imgs.push(new Uint8Array(await b.arrayBuffer()));const bytes=buildPDF(imgs,pageW,pageH);const blob=new Blob([bytes],{type:'application/pdf'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='CDCA_Module12_Reflections.pdf';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);const status=document.getElementById('reflectionStatus');if(status)status.textContent='Your PDF was created. Save it and submit it to Blackboard.'}

function roundRect(c,x,y,w,h,r,fill,stroke){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();if(fill)c.fill();if(stroke)c.stroke()}
