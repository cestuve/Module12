function buildPDF(images,pageW,pageH){const enc=new TextEncoder(),chunks=[],offsets=[0];let length=0;const pt=t=>{const b=enc.encode(t);chunks.push(b);length+=b.length},pb=b=>{chunks.push(b);length+=b.length};pt('%PDF-1.4\n%PDFIMG\n');const objCount=2+images.length*3,pageRefs=[];const obj=(n,w)=>{offsets[n]=length;pt(`${n} 0 obj\n`);w();pt('\nendobj\n')};images.forEach((img,i)=>{const po=3+i*3,co=4+i*3,io=5+i*3;pageRefs.push(`${po} 0 R`);obj(po,()=>pt(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /XObject << /Im${i+1} ${io} 0 R >> >> /Contents ${co} 0 R >>`));const content=`q\n612 0 0 792 0 0 cm\n/Im${i+1} Do\nQ\n`,cb=enc.encode(content);obj(co,()=>{pt(`<< /Length ${cb.length} >>\nstream\n`);pb(cb);pt('endstream')});obj(io,()=>{pt(`<< /Type /XObject /Subtype /Image /Width ${pageW} /Height ${pageH} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${img.length} >>\nstream\n`);pb(img);pt('\nendstream')})});obj(1,()=>pt('<< /Type /Catalog /Pages 2 0 R >>'));obj(2,()=>pt(`<< /Type /Pages /Kids [${pageRefs.join(' ')}] /Count ${images.length} >>`));const xref=length;pt(`xref\n0 ${objCount+1}\n0000000000 65535 f \n`);for(let i=1;i<=objCount;i++)pt(String(offsets[i]||0).padStart(10,'0')+' 00000 n \n');pt(`trailer\n<< /Size ${objCount+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);const total=chunks.reduce((n,b)=>n+b.length,0),out=new Uint8Array(total);let pos=0;for(const b of chunks){out.set(b,pos);pos+=b.length}return out}



function practiceDownload(){if(!state.reflections?.every(x=>String(x).trim().length)){const status=document.getElementById('reflectionStatus');if(status)status.textContent='Please complete all four responses before downloading.';return}downloadModule12PDF()}
function practiceFinish(){if(!state.reflections?.every(x=>String(x).trim().length)){const status=document.getElementById('reflectionStatus');if(status)status.textContent='Please complete all four responses before finishing the module.';return}mark(7);closeModal();main.innerHTML=`<div class="m12-final-scene"><div class="m12-final-card"><span class="mini-label">Harbor Point · Module 12 Complete</span><h2>Your Module 12 Reflection Report</h2><p>You've completed <strong>Group Therapy, Part 1</strong>.</p><p>Download the PDF below and upload it to the Module 12 assignment in Blackboard.</p><div class="button-row center"><button class="primary-btn" data-act="practice-download">Download My Module 12 PDF</button></div></div></div>`}

const actions={'practice-scene':practiceScene,'practice-intro':practiceIntro,'practice-quiz':practiceQuiz,'practice-next':practiceNext,'practice-reflections':practiceReflections,'practice-download':practiceDownload,'practice-finish':practiceFinish,'challenges-scene':challengesScene,'challenges-intro':challengesIntro,'challenges-types':challengesTypes,'challenges-observe':challengesObserve,'challenges-quiz':challengesQuiz,'challenges-next':challengesNext,'challenges-finish':challengesFinish,'facilitation-scene':facilitationScene,'facilitation-intro':facilitationIntro,'facilitation-skills':facilitationSkills,'facilitation-observe':facilitationObserve,'facilitation-quiz':facilitationQuiz,'facilitation-next':facilitationNext,'facilitation-finish':facilitationFinish,'intro':intro,'exterior':exterior,'maria-scene':mariaScene,'maria-talk':mariaTalk,'daniel-scene':danielScene,'daniel-talk':danielTalk,'benefits-scene':benefitsScene,'benefits':benefits,'scenario':scenario,'group-roles':groupRoles,'resource':resource,'end-preview':endPreview,'models-scene':modelsScene,'models-direct':()=>{visit(2);modelsIntro()},'models-intro':modelsIntro,'models-guide':modelsGuide,'model-cases':modelCases,'model-wrap':modelWrap,'model-next':nextModel,'end-third':endThird,'placement-scene':placementScene,'placement-intro':placementIntro,'placement-factors':placementFactors,'placement-quiz':placementQuiz,'placement-next':placementNext,'placement-wrap':placementWrap,'placement-finish':placementFinish,'safety-scene':safetyScene,'safety-intro':safetyIntro,'safety-agreements':safetyAgreements,'safety-privacy':safetyPrivacy,'safety-quiz':safetyQuiz,'safety-next':safetyNext,'safety-finish':safetyFinish};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act], [data-choice], [data-model-choice], [data-placement-choice], [data-safety-choice], [data-facilitation-choice], [data-challenge-choice], [data-practice-choice], [data-jump]');if(!b)return;if(b.hasAttribute('data-choice'))return answer(b.dataset.choice);if(b.hasAttribute('data-model-choice'))return answerModel(Number(b.dataset.modelChoice));if(b.hasAttribute('data-placement-choice'))return answerPlacement(Number(b.dataset.placementChoice));if(b.hasAttribute('data-safety-choice'))return answerSafety(Number(b.dataset.safetyChoice));if(b.hasAttribute('data-facilitation-choice'))return answerFacilitation(Number(b.dataset.facilitationChoice));if(b.hasAttribute('data-challenge-choice'))return answerChallenge(Number(b.dataset.challengeChoice));if(b.hasAttribute('data-practice-choice'))return answerPractice(Number(b.dataset.practiceChoice));if(b.hasAttribute('data-jump')){menu.classList.add('hidden');toggle.setAttribute('aria-expanded','false');return Number(b.dataset.jump)===0?mariaScene():Number(b.dataset.jump)===1?benefitsScene():Number(b.dataset.jump)===2?modelsScene():Number(b.dataset.jump)===3?placementScene():Number(b.dataset.jump)===4?safetyScene():Number(b.dataset.jump)===5?facilitationScene():Number(b.dataset.jump)===6?challengesScene():practiceScene()}actions[b.dataset.act]?.()});
// Answer the first group question directly from the modal, and reveal its continuation.
mc.addEventListener('click',e=>{const choice=e.target.closest('button[data-choice]');if(!choice)return;e.preventDefault();e.stopPropagation();if(choice.disabled)return;answer(choice.dataset.choice)});
document.addEventListener('input',e=>{if(e.target.matches('[data-reflection]')){const i=Number(e.target.dataset.reflection);if(!Array.isArray(state.reflections))state.reflections=['','','',''];state.reflections[i]=e.target.value;save();const status=document.getElementById('reflectionStatus');if(status)status.textContent='Your answers are saved as you type.'}});
toggle.addEventListener('click',()=>{let willOpen=menu.classList.contains('hidden');menu.classList.toggle('hidden');toggle.setAttribute('aria-expanded',String(willOpen))});
document.getElementById('closeModal').addEventListener('click',closeModal);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!mb.classList.contains('hidden'))closeModal()});
renderMenu();intro();
})();
</script></body></html>
